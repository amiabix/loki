[package]
name = "loki-wasm-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Compile spike only: does the signer core's REAL dependency subtree build for
# wasm32-unknown-unknown? Mirrors the external deps actually imported by
# src/signer/{local,coordination,nonce,wysiwys,secure_element,store}.rs, minus the
# halo2 prover (orchard default-features=false, pczt without "prover") because the
# in-browser signer verifies sighashes and signs but does NOT prove (proving is the
# server-side builder, section 2.D of the work definition).

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# No halo2 circuit: keys/notes/value only. unstable-frost matches loki-poc.
# unstable-voting-circuits only adds the `visibility` proc-macro crate, which
# `unstable-frost`'s `visibility::make(pub)` attrs in keys.rs need (upstream feature
# gap: unstable-frost uses visibility but doesn't declare it).
orchard            = { package = "zakura-orchard", version = "=2.2.0", default-features = false, features = ["std", "unstable-frost", "unstable-voting-circuits"] }
pczt               = { package = "zakura-pczt", version = "=0.1.0-rc4", default-features = false, features = ["orchard", "signer"] }
reddsa_frost       = { package = "zakura-reddsa", version = "=2.2.0", features = ["frost"] }
frost-core         = { version = "=3.0.0", features = ["serialization"] }
pasta_curves       = { package = "zakura-pasta-curves", version = "=2.2.0" }
chacha20poly1305   = "=0.10.1"
argon2             = { version = "0.5", default-features = false, features = ["alloc"] }
zcash_note_encryption = "0.4.2"
zcash_protocol     = { package = "zakura-protocol", version = "=2.2.0" }
zeroize            = "1"
rand_core          = { version = "0.6", features = ["getrandom"] }
# wasm getrandom backends. rand_core 0.6 -> getrandom 0.2 ("js"); rand 0.10 ->
# getrandom 0.4 ("wasm_js", also needs --cfg getrandom_backend="wasm_js").
getrandom          = { version = "0.2", features = ["js"] }
getrandom_v04      = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
