[package]
name = "loki-relay-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
loki-relay-protocol = { path = "../protocol" }
hpke = { version = "=0.14.1", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
ed25519-dalek = "=2.2.0"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
tokio = { version = "=1.54.0", features = ["macros", "rt-multi-thread", "sync", "net", "time", "signal"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
base64 = "=0.22.1"
hex = "=0.4.3"
getrandom = "=0.4.3"
zeroize = { version = "=1.8.2", path = "../../poc/vendor/zeroize-1.8.2" }
sha2 = "=0.10.9"

[dev-dependencies]
loki-relay-server = { path = "../relay" }
rand_core = "=0.10.1"
serde_json = "=1.0.154"
tokio-rustls = "=0.26.6"
tokio = { version = "=1.54.0", features = ["io-util"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
