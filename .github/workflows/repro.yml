name: repro

# Build the native and wasm signers twice, from two checkouts at different paths, and fail
# if any artifact hash differs. See docs/product/AUDIT_SCOPE.md §3.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: a
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: b
      - run: rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown
      - run: cargo +1.95.0 install wasm-pack --version 0.15.1 --locked
      - run: a/core/scripts/repro-build.sh > a.sha256
      - run: b/core/scripts/repro-build.sh > b.sha256
      - run: cat a.sha256 && diff a.sha256 b.sha256
