name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reject committed member secrets
        run: |
          if git ls-files | grep -E '(^|/)(passphrase|[^/]+\.passphrase|profile\.sealed|vault\.card|wallet\.sqlite(-wal|-shm|-journal)?|\.unlock-[^/]*)$'; then
            echo 'Member secrets must not be committed.' >&2
            exit 1
          fi
      - name: Check secret ignore patterns
        run: |
          for candidate in member/passphrase member/operator.passphrase member/profile/profile.sealed member/card/vault.card member/wallet.sqlite member/wallet.sqlite-wal member/wallet.sqlite-shm member/wallet.sqlite-journal member/.unlock-test; do
            git check-ignore -q --no-index "$candidate"
          done
          for candidate in communication/client/tests/fixtures/hosted-tls/server-key.pem poc/tests/zip2005_keys.rs web/wallet/tests/registration.test.mjs; do
            ! git check-ignore -q --no-index "$candidate"
          done

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Full debuginfo on ~35 test binaries fills the runner disk (ld dies with SIGBUS).
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown
      # The frostd tests need a live relay on loopback; this is the ZF frostd revision the
      # testnet host runs.
      - name: Start frostd
        run: |
          cargo +1.95.0 install --locked --git https://github.com/ZcashFoundation/frost-tools --rev 53df99c2bd61f7cb60a0d1f634822a76be3799cf frostd
          frostd -n -p 2744 > "$RUNNER_TEMP/frostd.log" 2>&1 &
      - name: Test poc
        working-directory: poc
        env:
          FROSTD_URL: http://127.0.0.1:2744
        run: cargo +1.95.0 test --locked
      - name: Test loki-signer-core
        working-directory: poc
        run: cargo +1.95.0 test --locked -p loki-signer-core
      # The native test artifacts fill the runner disk; the wasm link needs the room.
      - name: Free native test artifacts
        run: rm -rf poc/target/debug
      - name: Build wasm signer
        working-directory: poc
        env:
          RUSTFLAGS: --cfg getrandom_backend="wasm_js"
        run: cargo +1.95.0 build --locked -p loki-signer-wasm --target wasm32-unknown-unknown
      - name: Build wasm transport
        working-directory: poc/wasm-transport
        env:
          RUSTFLAGS: --cfg getrandom_backend="wasm_js"
        run: cargo +1.95.0 build --locked --target wasm32-unknown-unknown

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web/wallet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: node --experimental-strip-types --test tests/*.test.mjs scripts/wallet-ui.test.mjs
